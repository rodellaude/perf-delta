# Perf-Delta Configuration (managed by Perf-Delta Live Settings & Static Report Engine)

params:
  project: ""
  version: v2.0
  report_theme: cyber-slate
rmd_template: .engine/dashboard.Rmd
output_dir: Reports
database_path: Data/Performance_Vault.db
sla_file_path: SLA/performance-sla.yaml
evidence_dir: Evidence
ai_summary_enabled: "false"
ai_provider: gemini
ai_providers:
  gemini:
    url: https://generativelanguage.googleapis.com/v1beta/models
    model_id: gemini-2.5-flash
  amplify:
    url: https://amplify.planittesting.com/external/api/completion
    model_id: 19b89d52-23cf-463d-a5bb-c2896a0f8661
ai_url: https://generativelanguage.googleapis.com/v1beta/models
ai_model_id: gemini-2.5-flash
timezone:
  source_timezone: UTC
  display_timezone: Pacific/Auckland
  show_timezone_abbr: true
workload_profile:
  ramp_up: ""
  steady_state: ""
  ramp_down: ""
ai_prompt_template: >
  Write a clear, natural executive summary of this performance test for project stakeholders.


  Writing Style:

  - Use plain, natural British English (e.g. optimised, prioritised, analysed, behaviour).

  - Write the way an experienced performance engineer speaks to a delivery team: clear, concise, and easy to read.

  - Bold important numbers, journey names, transaction names, and outcomes inline (e.g. **289 virtual users**, **2.31
  TPS**, **0.03% error rate**, **1,960 ms**).

  - If Ramp-down is "none" or empty, simply do not mention ramp-down at all (never write "without ramp-down").

  - Do NOT invent metrics, journeys, or errors not present in the data below.


  Test Results:

  Application : {app_names} ({env})

  Test Type   : {test_type}

  Run Date    : {run_date}

  Workload    : {vu_actual} virtual users ({duration_desc})

  Throughput  : {throughput} TPS

  Error Rate  : {error_rate}%

  Latency     : {latency} ms ({baseline_comp})

  Status      : {overall_status}

  Breaches    : {breach_cnt} ({rt_metric}) — slowest transaction: {worst_label} at {worst_rt} ms vs {worst_sla} ms
  target

  Main Flows  : {flow_theme}


  User Journey Breakdown vs Baseline (#{baseline_run_id}):

  {journey_breakdown}


  Error Breakdown:

  {error_breakdown}


  Structure (follow this exact layout):

  PARAGRAPH 1: One concise paragraph (2–3 sentences) summarising how the {test_type} on **{run_date}** ran—virtual
  users, ramp-up and steady-state profile, average throughput, error rate, and how overall **{rt_metric}** latency
  compared with baseline run **#{baseline_run_id}**.


  Followed by a blank line and these structured nested bullets summarising the journey & error findings (use 2-space
  indented sub-bullets `  - ` for individual journeys under each category heading; omit a category only if empty):

  - **Improved:**
    - List each improved user journey vs baseline as a 2-space indented sub-bullet (e.g. `  - **UJ09_WaterQualitySiteDetailsPage:** P95 **1,374 ms** (**-44.7%**)`).
  - **Broadly Stable:**
    - List each stable user journey vs baseline as a 2-space indented sub-bullet.
  - **Regressions & Slowest Outlier:**
    - List any regressed journeys as 2-space indented sub-bullets and include a sub-bullet for the slowest outlier **{worst_label}** at **{worst_rt} ms** ({rt_metric}).
  - **Error Summary ({error_rate}% Error Rate):** Concisely summarise the failing transactions and root HTTP/connection
  errors from the Error Breakdown above (or state that **0 errors** occurred if none).


  Next steps:

  - First bullet: Which slow journey, outlier transaction, or error to investigate first (bold the transaction/journey
  name).

  - Second bullet: What practical tuning or fix to look into.

  - Third bullet: Re-running the test under the same load to confirm the fix worked.
label_exclusions:
  - c_Thinktime
  - Test Action
  - Debug Sampler
  - c_UserLetter_pacing
  - dw_pacing
  - HA_pacing
  - BDR_pacing
  - TAS_pacing
  - c_CMS_Pacing
tool_type: jmeter
tool_mappings:
  jmeter:
    timestamp: timeStamp
    elapsed: elapsed
    label: label
    responseCode: responseCode
    responseMessage: responseMessage
    threadName: threadName
    dataType: dataType
    success: success
    failureMessage: failureMessage
    bytes: bytes
    sentBytes: sentBytes
    grpThreads: grpThreads
    allThreads: allThreads
    URL: URL
    Latency: Latency
    IdleTime: IdleTime
    Connect: Connect
  neoload:
    timestamp: Time
    elapsed: Response time
    label: Element
    success: Success
    threadName: Virtual User ID
    userPath: User Path
    population: Population
bin_size: 60
user_action_filter: .*
