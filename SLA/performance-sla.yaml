# Perf-Delta SLA Thresholds (managed by Perf-Delta Live Settings & Static Report Engine)

show_overall_status: false
sla_rules:
  - metric: total_users
    enabled: false
    label: Virtual Users
    operator: ">="
    threshold: 1
    description: At least 1 virtual user must be recorded for the run to be valid.
  - metric: error_rate
    enabled: false
    label: Error Rate
    operator: <=
    threshold: 10
    unit: "%"
    description: Error rate per scenario must not exceed XX%.
    application_thresholds:
      - app_name: MyMSD-CPP-X5
        threshold: 10
      - app_name: ECS-X5
        threshold: 10
      - app_name: EOS
        threshold: 10
      - app_name: CPP
        threshold: 10
      - app_name: APIM
        threshold: 10
      - app_name: BPM
        threshold: 10
  - metric: throughput
    enabled: false
    label: Throughput
    operator: ">="
    threshold: 5.1
    unit: tps
    description: Throughput per application must sustain at least X transactions per second.
    application_thresholds:
      - app_name: MyMSD-CPP-X5
        threshold: 5
      - app_name: ECS-X5
        threshold: 3.9
      - app_name: EOS
        threshold: 5.1
      - app_name: CPP
        threshold: 5.1
      - app_name: APIM
        threshold: 5.1
      - app_name: BPM
        threshold: 5.1
response_time_sla:
  enabled: false
  metric: p95
  unit: ms
  default_threshold: 3000
  overrides:
    - label: MyMSD
      threshold: 3000
    - label: CMS
      threshold: 100
    - label: MyMSD_003_Login_ButtonSelection_Registration
      threshold: 2000
  tolerance_pct: 0
